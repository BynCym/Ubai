name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: windows-latest
            build_cmd: build:win
            artifact: dist/*.exe
          - platform: macos-latest
            build_cmd: build:mac
            artifact: dist/*.dmg
          - platform: ubuntu-latest
            build_cmd: build:linux
            artifact: dist/*.AppImage

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run ${{ matrix.build_cmd }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ubai-${{ matrix.platform }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true
          body: |
            ## Ubai - 专注时光

            下载对应系统的安装包即可使用。

            | 系统 | 文件 |
            |------|------|
            | Windows | `Ubai Setup *.exe` |
            | macOS | `Ubai-*.dmg` |
            | Linux | `Ubai-*.AppImage` |
